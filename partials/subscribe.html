<div class="subscribe">
  <form data-subscribe novalidate data-msg-empty="Indiquez votre adresse e-mail." data-msg-invalid="Cette adresse semble incomplète. Exemple : nom@domaine.com">
    <div class="field">
      <label class="label" for="subscribe-email">Être prévenu des prochaines dates</label>
      <div class="subscribe__row">
        <div class="field__control">
          <input class="field__input" id="subscribe-email" name="email" type="email" autocomplete="email" placeholder="Votre adresse e-mail" required aria-describedby="subscribe-email-msg">
          <span class="field__line" aria-hidden="true"></span>
        </div>
        <button class="btn btn--solid" type="submit"><span>M'avertir</span></button>
      </div>
      <p class="field__message" id="subscribe-email-msg" aria-live="polite"><svg class="icon" aria-hidden="true"><use href="{{root}}icons/sprite.svg#i-warning-circle"></use></svg><span class="field__message-text"></span></p>
    </div>
  </form>
  <p class="subscribe__done" hidden tabindex="-1"><svg class="icon" aria-hidden="true"><use href="{{root}}icons/sprite.svg#i-check"></use></svg><span>C'est noté. Vous recevrez les prochaines dates.</span></p>
</div>
